<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9eff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d6fd8;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111318;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0c10;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="#4a9eff" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Shield -->
  <path d="M 50 15 L 78 24 L 78 46 Q 78 68 50 82 Q 22 68 22 46 L 22 24 Z"
        fill="url(#shieldGrad)" filter="url(#glow)"/>

  <!-- Shield inner -->
  <path d="M 50 20 L 73 28 L 73 46 Q 73 64 50 76 Q 27 64 27 46 L 27 28 Z"
        fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.2"/>

  <!-- Checkmark -->
  <polyline points="36,50 46,62 66,38"
            fill="none" stroke="white" stroke-width="5"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Glow dot bottom -->
  <ellipse cx="50" cy="86" rx="16" ry="4"
           fill="#4a9eff" fill-opacity="0.2"/>
</svg>
