<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9eff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d6fd8;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background (light) -->
  <rect width="400" height="120" fill="#f8fafc" rx="12"/>

  <!-- Shield shape -->
  <path d="M 55 18 L 95 18 L 95 28 Q 95 62 75 75 Q 55 62 55 28 Z"
        fill="url(#shieldGrad)" filter="url(#glow)"/>

  <!-- Shield inner highlight -->
  <path d="M 60 22 L 90 22 L 90 30 Q 90 58 75 69 Q 60 58 60 30 Z"
        fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>

  <!-- Check mark -->
  <polyline points="65,46 72,54 86,38"
            fill="none" stroke="white" stroke-width="3.5"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- App Name -->
  <text x="112" y="58"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="36" font-weight="800"
        letter-spacing="-1"
        fill="#0f172a">Job</text>
  <text x="176" y="58"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="36" font-weight="800"
        letter-spacing="-1"
        fill="url(#shieldGrad)">Shield</text>

  <!-- Tagline -->
  <text x="113" y="78"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="11" font-weight="400"
        letter-spacing="3"
        fill="#94a3b8">YOUR FIRST LINE OF DEFENSE</text>

  <!-- AI badge -->
  <rect x="113" y="88" width="28" height="14" rx="4"
        fill="#4a9eff" fill-opacity="0.1"
        stroke="#4a9eff" stroke-width="0.8"/>
  <text x="127" y="99"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="8" font-weight="700"
        fill="#4a9eff" text-anchor="middle"
        letter-spacing="1">AI</text>

  <circle cx="147" cy="95" r="1.5" fill="#94a3b8"/>

  <text x="153" y="99"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="8" fill="#94a3b8"
        letter-spacing="0.5">Powered by BERT + XGBoost</text>
</svg>
